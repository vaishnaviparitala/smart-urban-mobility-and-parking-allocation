server.port=8080
spring.application.name=api-gateway

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# JWT - must be IDENTICAL to auth-service
jwt.secret=SmartParkingSecretKeyForSOAProject2026!!

# Rate limit (requests per minute per client IP)
gateway.rate-limit.max-requests-per-minute=100

# ---------------- Routes (lb:// = look up in Eureka and load-balance) ----------------
# NOTE: there is NO route for /internal/** so those endpoints can never be reached from outside.

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=parking-service
spring.cloud.gateway.routes[1].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/parking/**
spring.cloud.gateway.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[1].filters[0].args.name=parkingCB
spring.cloud.gateway.routes[1].filters[0].args.fallbackUri=forward:/fallback

spring.cloud.gateway.routes[2].id=allocation-service
spring.cloud.gateway.routes[2].uri=lb://ALLOCATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/allocate/**
spring.cloud.gateway.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[2].filters[0].args.name=allocationCB
spring.cloud.gateway.routes[2].filters[0].args.fallbackUri=forward:/fallback

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**
spring.cloud.gateway.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.routes[3].filters[0].args.name=bookingCB
spring.cloud.gateway.routes[3].filters[0].args.fallbackUri=forward:/fallback
